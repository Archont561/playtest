# yaml-language-server: $schema=https://alint.org/_alint/configuration/schema.json
# Repository-specific Alint rules complementing vendor/clean-code-presets/alint/strict.yml.
version: 1

rules:
  - id: require-license
    kind: file_exists
    paths: LICENSE
    level: error
    message: Root LICENSE file (MIT) is required.

  - id: require-cargo-workspace
    kind: file_exists
    paths: Cargo.toml
    level: error
    message: Root Cargo.toml workspace manifest is missing.

  - id: require-cargo-lock
    kind: file_exists
    paths: Cargo.lock
    level: error
    message: Root Cargo.lock is missing.

  - id: require-deny-toml
    kind: file_exists
    paths: deny.toml
    level: error
    message: Root deny.toml dependency policy is missing.

  - id: require-audit-toml
    kind: file_exists
    paths: .cargo/audit.toml
    level: error
    message: Required .cargo/audit.toml is missing.

  - id: require-sandbox-config
    kind: file_exists
    paths: pixi-sandbox.toml
    level: error
    message: Required pixi-sandbox.toml is missing.

  - id: require-sandbox-restore
    kind: file_exists
    paths: scripts/restore.sh
    level: error
    message: Required scripts/restore.sh launcher is missing.

  - id: forbid-non-restore-scripts
    kind: file_absent
    paths:
      - scripts/**
      - "!scripts/restore.sh"
    level: error
    message: Only scripts/restore.sh is permitted in scripts/; place all other repository automation in automation/.

  - id: require-clean-code-vendor-pin
    kind: file_exists
    paths: vendor/clean-code-presets/UPSTREAM.pin
    level: error
    message: Vendored polyglot-clean-code UPSTREAM.pin is missing.

  - id: require-clean-code-vendor-manifest
    kind: file_exists
    paths: vendor/clean-code-presets/VENDOR.sha256
    level: error
    message: Vendored polyglot-clean-code VENDOR.sha256 integrity manifest is missing.

  - id: forbid-subproject-pixi-manifests
    kind: file_absent
    paths:
      - python/pixi.toml
      - typescript/pixi.toml
      - cpp/pixi.toml
      - c/pixi.toml
      - csharp/pixi.toml
      - go/pixi.toml
      - java/pixi.toml
      - r/pixi.toml
    level: error
    message: All Pixi environments belong in the single root pixi.toml workspace.

  - id: require-ts-bunup-config
    kind: file_exists
    paths: typescript/bunup.config.ts
    level: error
    message: TypeScript SDK must define typescript/bunup.config.ts for bunup builds.

  - id: require-ts-tsconfig
    kind: file_exists
    paths: typescript/tsconfig.json
    level: error
    message: TypeScript SDK must define typescript/tsconfig.json for @/ SDK root alias resolution.

  - id: require-ts-bunup-build-script
    kind: json_path_equals
    paths: typescript/package.json
    path: $.scripts.build
    equals: bunup
    level: error
    message: TypeScript SDK build script in typescript/package.json must invoke bunup.

  - id: require-ts-sdk-root-alias
    kind: json_path_equals
    paths: typescript/tsconfig.json
    path: "$.compilerOptions.paths['@/*']"
    equals:
      - "./*"
    level: error
    message: TypeScript SDK tsconfig.json must alias @/* to ./* (SDK root) for dev and bunup builds.

  - id: require-ts-bunup-tsconfig-alias
    kind: file_content_matches
    paths: typescript/bunup.config.ts
    pattern: 'preferredTsconfig:\s*"\./tsconfig\.json"'
    level: error
    message: typescript/bunup.config.ts must reference preferredTsconfig "./tsconfig.json" so bunup resolves @/ aliases at build time.

  - id: forbid-ts-relative-imports
    kind: import_gate
    language: js
    paths:
      - "typescript/**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
      - "!typescript/node_modules/**"
    forbid: '^\.\.?(?:/|$)'
    level: error
    message: Relative and nested parent imports (./ or ../) are forbidden in the TypeScript SDK; use the @/ SDK root alias instead.

  # One version per release (ADR 0015). The Rust workspace manifest is the authority;
  # every other ecosystem manifest must carry the same version. automation/stamp_version.py
  # already reads all ten locations, and this rule makes the invariant declarative so a
  # hand-edited manifest fails the gate before it reaches a release.
  - id: require-aligned-manifest-versions
    kind: cross_file
    source:
      file: Cargo.toml
      extract:
        toml: $.workspace.package.version
    targets:
      - file: package.json
        extract:
          json: $.version
      - file: python/pyproject.toml
        extract:
          toml: $.project.version
      - file: typescript/package.json
        extract:
          json: $.version
      - file: go/VERSION
        extract:
          regex: '([0-9]+\.[0-9]+\.[0-9]+)'
      - file: r/DESCRIPTION
        extract:
          regex: '(?m)^Version:\s*(\S+)\s*$'
      - file: cpp/CMakeLists.txt
        extract:
          regex: 'project\([^)]*?VERSION\s+([0-9A-Za-z.+-]+)'
      - file: c/CMakeLists.txt
        extract:
          regex: 'project\([^)]*?VERSION\s+([0-9A-Za-z.+-]+)'
      - file: csharp/src/Playtest/Playtest.csproj
        extract:
          regex: '<Version>([^<]+)</Version>'
      - file: java/pom.xml
        extract:
          regex: '<artifactId>playtest</artifactId>\s*<version>([^<]+)</version>'
    level: error
    message: Every ecosystem manifest must declare the same version as Cargo.toml (workspace.package.version); bump all of them in one change.

  # Every language target directory is a self-describing package: a build manifest the
  # ecosystem's tooling reads, and a README a consumer lands on. Declared here rather than
  # in Python so a new target cannot be added without both.
  #
  # `dir_contains` rather than `every_matching_has`: the latter evaluates nested rules
  # against the repository root, so a per-directory file_exists passes vacuously as soon as
  # any target satisfies the glob. Verified before adopting.
  - id: require-sdk-target-manifest
    kind: dir_contains
    select: '{python,typescript,cpp,c,csharp,go,java,r}'
    require:
      - '{pyproject.toml,package.json,CMakeLists.txt,go.mod,pom.xml,DESCRIPTION,conanfile.py,*.slnx}'
    level: error
    message: Every language target directory needs its ecosystem build manifest; joining the matrix means shipping one.

  - id: require-sdk-target-readme
    kind: dir_contains
    select: '{python,typescript,cpp,c,csharp,go,java,r}'
    require:
      - '{README.md,README.rst,DESCRIPTION}'
    level: error
    message: Every language target directory needs a README so a consumer lands on documentation, not a bare source tree.
