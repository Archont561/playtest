# Dependabot v2 configuration for Playtest.
# Generated sandbox workflows (relock.yml, publish-sandbox.yml) are excluded because
# they are owned by `pixi-sandbox init` and verified by `pixi-sandbox init --check`.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    exclude-paths:
      - ".github/workflows/relock.yml"
      - ".github/workflows/publish-sandbox.yml"
