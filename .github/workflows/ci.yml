name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIXI_VERSION: v0.84.1
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  scope:
    name: change-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      any_code: ${{ steps.detect.outputs.any_code }}
      has_sdks: ${{ steps.detect.outputs.has_sdks }}
      sdks: ${{ steps.detect.outputs.sdks }}
      rust: ${{ steps.detect.outputs.rust }}
      py: ${{ steps.detect.outputs.py }}
      ts: ${{ steps.detect.outputs.ts }}
      cpp: ${{ steps.detect.outputs.cpp }}
      c: ${{ steps.detect.outputs.c }}
      csharp: ${{ steps.detect.outputs.csharp }}
      go: ${{ steps.detect.outputs.go }}
      java: ${{ steps.detect.outputs.java }}
      r: ${{ steps.detect.outputs.r }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compute affected CI lanes
        id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: python3 -m automation.change_scope --base "$BASE_SHA"

  fast:
    name: fast-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Pixi default environment
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: default
          locked: true
          cache: true
      - name: Verify Bun workspace lockfile
        run: pixi run --frozen bun-install
      - name: Run Clean Code, structure, workflow, TOML, sandbox, and automation gates
        run: pixi run --frozen doit fast

  rust:
    name: rust-workspace
    needs: [scope, fast]
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Pixi default environment
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: default
          locked: true
          cache: true
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run Rust formatting, clippy, nextest, and doc tests
        run: pixi run --frozen offline-rs
      - name: Run offline Rust dependency policy checks
        run: pixi run --frozen audit-local
      - name: Dry-run crate packaging across 5 workspace crates
        run: pixi run --frozen package-rs
      - name: Capture Rust LCOV coverage
        run: pixi run --frozen coverage-rs
      - name: Upload Rust LCOV tracefile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-rust
          path: coverage/lcov-rs.info
          if-no-files-found: error

  msrv-cli:
    name: cargo-install-rust-1.88
    needs: [scope, fast]
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun for TypeScript asset build
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install Rust 1.88.0 floor toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88.0"
      - name: Cache Rust 1.88 artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv-1.88
      - name: Stage embedded SDK assets for MSRV verification
        run: python3 -m automation.stage_assets --build-generated
      - name: Verify cargo install --locked on Rust 1.88
        shell: bash
        run: |
          if ! cargo install --path crates/playtest-cli --locked --root "$RUNNER_TEMP/cargo-root" 2> "$RUNNER_TEMP/cargo-msrv.err"; then
            cat "$RUNNER_TEMP/cargo-msrv.err" >&2
            msg="$(tr '\n' ' ' < "$RUNNER_TEMP/cargo-msrv.err")"
            echo "::error title=cargo-install-rust-1.88::${msg}"
            exit 101
          fi
      - name: Verify installed playtest binary version
        run: '"$RUNNER_TEMP/cargo-root/bin/playtest" version'
      - name: Clean staged SDK assets
        run: python3 -m automation.stage_assets --clean

  mirrors-matrix:
    name: mirrors-${{ matrix.os }}
    needs: [scope, fast]
    if: >-
      needs.scope.outputs.rust == 'true' ||
      needs.scope.outputs.py == 'true' ||
      needs.scope.outputs.ts == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bin: target/debug/playtest
          - os: macos-15-intel
            bin: target/debug/playtest
          - os: windows-2025
            bin: target/debug/playtest.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install TypeScript SDK build dependencies
        shell: bash
        run: bun install --cwd typescript --frozen-lockfile
      - name: Build TypeScript SDK dist output with bunup
        shell: bash
        run: bun run --cwd typescript build
      - name: Build Playtest CLI
        shell: bash
        run: cargo build -p playtest-cli --locked
      - name: Record mirror SHA-256 digests on ${{ matrix.os }}
        shell: bash
        run: python -m automation.verify_mirrors record-hashes --cli-bin "${{ matrix.bin }}" --output "mirror-hashes-${{ matrix.os }}.json" --platform "${{ matrix.os }}"
      - name: Upload mirror hash manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mirror-hashes-${{ matrix.os }}
          path: mirror-hashes-${{ matrix.os }}.json
          if-no-files-found: error
      - name: Install uv, Node.js, and pnpm for offline installer suite
        if: matrix.os == 'ubuntu-24.04'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Set up pnpm for offline installer and npm wrapper verification
        if: matrix.os == 'ubuntu-24.04'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - name: Set up Node.js 22 for npm and pnpm verification
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Verify offline fresh-clone installs and upgrades across uv, npm, pnpm, and Bun
        if: matrix.os == 'ubuntu-24.04'
        run: python -m automation.verify_mirrors verify-installers --cli-bin target/debug/playtest
      - name: Verify default-settings npm wrapper installs across npm, pnpm, and Bun
        if: matrix.os == 'ubuntu-24.04'
        run: python -m automation.npm_packages verify-clean-installs --cli-bin target/debug/playtest

  mirrors-compare:
    name: mirrors-determinism
    needs: [scope, mirrors-matrix]
    if: >-
      always() &&
      (needs.scope.outputs.rust == 'true' ||
       needs.scope.outputs.py == 'true' ||
       needs.scope.outputs.ts == 'true') &&
      needs.mirrors-matrix.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download cross-OS mirror hash manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mirror-hashes-*
          path: mirror-hashes/
      - name: Assert byte-identical mirror SHA-256 digests across Linux, macOS, and Windows
        run: python3 -m automation.verify_mirrors compare-hashes mirror-hashes/

  sdk:
    name: sdk-${{ matrix.lane }}
    needs: [scope, fast]
    if: needs.scope.outputs.has_sdks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.scope.outputs.sdks) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up isolated Pixi SDK environment
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: ${{ matrix.lane }}
          locked: true
          cache: true
      - name: Check SDK formatting
        run: pixi run --frozen -e ${{ matrix.lane }} sdk-fmt-check
      - name: Run SDK linters
        run: pixi run --frozen -e ${{ matrix.lane }} sdk-lint
      - name: Run SDK test suite
        run: pixi run --frozen -e ${{ matrix.lane }} sdk-test
      - name: Verify SDK packaging
        run: pixi run --frozen -e ${{ matrix.lane }} sdk-package
      - name: Capture SDK coverage
        run: pixi run --frozen -e ${{ matrix.lane }} sdk-coverage
      - name: Upload SDK LCOV tracefile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-${{ matrix.lane }}
          path: "*/coverage/*.info"
          if-no-files-found: ignore

  coverage:
    name: coverage-report
    needs: [scope, rust, sdk]
    if: >-
      always() &&
      needs.scope.outputs.any_code == 'true' &&
      (needs.rust.result == 'success' || needs.rust.result == 'skipped') &&
      (needs.sdk.result == 'success' || needs.sdk.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download LCOV artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lcov-*
          path: coverage/artifacts
      - name: Merge normalized LCOV tracefiles
        run: python3 -m automation.merge_lcov --allow-empty -o coverage/lcov.info coverage/artifacts
      - name: Upload unified coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

  gates:
    name: gates
    needs: [scope, fast, rust, msrv-cli, mirrors-matrix, mirrors-compare, sdk, coverage]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Evaluate upstream CI gate results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -m automation.ci_gate
