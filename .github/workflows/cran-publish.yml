name: Submit R package to CRAN

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "R release tag to submit (vX.Y.Z or r-vX.Y.Z)"
        required: true
        type: string
      confirmation:
        description: 'Type CONFIRM to upload this package to CRAN'
        required: true
        type: string

concurrency:
  group: cran-publish-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  submit:
    name: Check and submit selected R release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cran
    env:
      AUTHOR_EMAIL: ${{ vars.AUTHOR_EMAIL || secrets.AUTHOR_EMAIL }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate R release tag
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" =~ ^(v|r[-/]v|cran[-/]v)([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "R release version: ${BASH_REMATCH[2]}"
          else
            echo "Unsupported R release tag '$RELEASE_TAG'; expected vX.Y.Z or r-vX.Y.Z." >&2
            exit 1
          fi
      - name: Checkout selected release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Stamp R package version and maintainer email
        shell: bash
        run: |
          VERSION="${RELEASE_TAG##*v}"
          python scripts/stamp_release_version.py r "$VERSION" --author-email "$AUTHOR_EMAIL"
      - name: Check and submit to CRAN
        uses: coatless-actions/cran-submission@0224a35fffe0afcac8392b2520d966537866da83
        with:
          pkg-directory: r
          check-directory: check
          error-on: warning
          create-issue: false
          confirmation: ${{ inputs.confirmation }}
