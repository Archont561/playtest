name: Submit R Package to CRAN

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to submit to CRAN (e.g. v0.2.0)"
        required: true
        type: string
      confirmation:
        description: "Type CONFIRM to upload this package to CRAN"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cran-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  submit:
    name: Check and Submit Selected R Release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: cran
    env:
      AUTHOR_EMAIL: ${{ vars.AUTHOR_EMAIL || secrets.AUTHOR_EMAIL }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout selected release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Validate CRAN release tag
        run: python3 -m automation.release validate-cran-tag --tag "$RELEASE_TAG"
      - name: Stamp R package version and maintainer email
        run: python3 -m automation.stamp_version r "$RELEASE_TAG" --author-email "$AUTHOR_EMAIL"
      - name: Check and submit to CRAN
        uses: coatless-actions/cran-submission@0224a35fffe0afcac8392b2520d966537866da83 # v1.0.0
        with:
          pkg-directory: r
          check-directory: check
          error-on: warning
          create-issue: false
          confirmation: ${{ inputs.confirmation }}
