# Generated by pixi-sandbox init.
# pixi-sandbox-version: 0.8.0
name: publish sandbox

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "publish-sandbox-${{ github.repository }}"
  cancel-in-progress: false

env:
  PIXI_SANDBOX_VERSION: 0.8.0

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned pixi-sandbox release
        shell: bash
        env:
          PIXI_SANDBOX_BIN: ${{ runner.temp }}/pixi-sandbox-bin/pixi-sandbox
        run: |
          set -euo pipefail
          asset=pixi-sandbox-x86_64-unknown-linux-musl
          base="https://github.com/Archont561/pixi-sandbox/releases/download/v$PIXI_SANDBOX_VERSION"
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 --output "$stage/$asset" "$base/$asset"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 --output "$stage/SHA256SUMS" "$base/SHA256SUMS"
          digest=$(awk -v name="$asset" '{ sub(/\r$/, ""); if ($2 == name || $2 == "*" name) { if (NF == 2) print $1; else print "invalid" } }' "$stage/SHA256SUMS")
          [[ "$digest" =~ ^[[:xdigit:]]{64}$ ]] || { echo "::error::missing, duplicate or malformed checksum for $asset"; exit 1; }
          printf '%s  %s\n' "$digest" "$asset" > "$stage/selected.sha256"
          (cd "$stage" && sha256sum --check selected.sha256)
          chmod +x "$stage/$asset"
          mkdir -p "$(dirname "$PIXI_SANDBOX_BIN")"
          mv "$stage/$asset" "$PIXI_SANDBOX_BIN"
          printf '%s\n' "$(dirname "$PIXI_SANDBOX_BIN")" >> "$GITHUB_PATH"
      - id: plan
        shell: bash
        run: echo "matrix=$(pixi-sandbox plan --config pixi-sandbox.toml --json)" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          run-install: false
      - name: Fetch the pinned pixi-sandbox release
        shell: bash
        env:
          PIXI_SANDBOX_BIN: ${{ runner.temp }}/pixi-sandbox-bin/pixi-sandbox
        run: |
          set -euo pipefail
          asset=pixi-sandbox-x86_64-unknown-linux-musl
          base="https://github.com/Archont561/pixi-sandbox/releases/download/v$PIXI_SANDBOX_VERSION"
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 --output "$stage/$asset" "$base/$asset"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 --output "$stage/SHA256SUMS" "$base/SHA256SUMS"
          digest=$(awk -v name="$asset" '{ sub(/\r$/, ""); if ($2 == name || $2 == "*" name) { if (NF == 2) print $1; else print "invalid" } }' "$stage/SHA256SUMS")
          [[ "$digest" =~ ^[[:xdigit:]]{64}$ ]] || { echo "::error::missing, duplicate or malformed checksum for $asset"; exit 1; }
          printf '%s  %s\n' "$digest" "$asset" > "$stage/selected.sha256"
          (cd "$stage" && sha256sum --check selected.sha256)
          chmod +x "$stage/$asset"
          mkdir -p "$(dirname "$PIXI_SANDBOX_BIN")"
          mv "$stage/$asset" "$PIXI_SANDBOX_BIN"
          printf '%s\n' "$(dirname "$PIXI_SANDBOX_BIN")" >> "$GITHUB_PATH"

      - name: Pack, verify, and publish
        shell: bash
        env:
          PIXI_SANDBOX_PUSH_TOKEN: ${{ github.token }}
          PIXI_SANDBOX_BIN: ${{ runner.temp }}/pixi-sandbox-bin/pixi-sandbox
        run: >-
          "$PIXI_SANDBOX_BIN" pipeline
          --envs "${{ matrix.environments }}"
          --platform "${{ matrix.platform }}"
          --branch "${{ matrix.branch }}"
          --remote "${{ github.server_url }}/${{ github.repository }}.git"
          --config pixi-sandbox.toml
          --cargo-vendor "${{ matrix.cargo_vendor }}"
          --transport-dir "${{ runner.temp }}/pixi-sandbox-transport"
          --log-dir "${{ runner.temp }}/pixi-sandbox-logs"
