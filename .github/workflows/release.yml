name: Release

on:
  push:
    tags:
      - "v[0-9]*"
      - "!milestone-v*"
      - "!milestone/**"
      - "!m-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Unified release tag to publish (e.g. v0.2.0)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PIXI_VERSION: v0.84.1
  CARGO_INCREMENTAL: "0"

jobs:
  plan:
    name: Inspect Tag & Plan Targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      valid: ${{ steps.parse.outputs.valid }}
      tag_name: ${{ steps.parse.outputs.tag_name }}
      version: ${{ steps.parse.outputs.version }}
      rust: ${{ steps.parse.outputs.rust }}
      python: ${{ steps.parse.outputs.python }}
      typescript: ${{ steps.parse.outputs.typescript }}
      go: ${{ steps.parse.outputs.go }}
      java: ${{ steps.parse.outputs.java }}
      cpp: ${{ steps.parse.outputs.cpp }}
      c: ${{ steps.parse.outputs.c }}
      csharp: ${{ steps.parse.outputs.csharp }}
      r: ${{ steps.parse.outputs.r }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse and validate unified release tag
        id: parse
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 -m automation.release plan --tag "$RELEASE_TAG"

  gate:
    name: Monorepo Quality & Version Alignment Gate
    needs: [plan]
    if: needs.plan.outputs.valid == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_name }}
      - name: Set up Pixi workspace environments
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          locked: true
          cache: true
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Stamp unified release version across manifests
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
        run: python3 -m automation.stamp_version all "$RELEASE_TAG"
      - name: Build TypeScript dist before CLI verification
        run: pixi run --frozen build-ts-dist
      - name: Compile Playtest CLI for version alignment check
        run: pixi run --frozen cargo build -p playtest-cli --locked
      - name: Verify manifest, CLI, and embedded asset version alignment
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
        run: python3 -m automation.release_binaries verify-version --version "$RELEASE_TAG" --cli-bin target/debug/playtest
      - name: Run Clean Code and governance gates
        run: pixi run --frozen doit fast
      - name: Run polyglot test suites
        run: pixi run --frozen test-all

  build-cli:
    name: Build CLI Archive (${{ matrix.target }})
    needs: [plan, gate]
    if: needs.plan.outputs.rust == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            bin_name: playtest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            bin_name: playtest
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            bin_name: playtest
          - target: aarch64-apple-darwin
            runner: macos-15
            bin_name: playtest
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            bin_name: playtest.exe
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_name }}
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install musl tools on Linux runners
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Install Rust toolchain and target ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cli-${{ matrix.target }}
      - name: Stamp unified release version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
        run: python -m automation.stamp_version all "$RELEASE_TAG"
      - name: Compile, package, and verify ${{ matrix.target }} CLI archive
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
        run: python -m automation.release_binaries build-target --target "${{ matrix.target }}" --version "$RELEASE_TAG" --raw-dir raw-bin --dist-dir release-assets
      - name: Upload GitHub Release archive and .sha256 sidecar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-archive-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
      - name: Upload compiled binary for npm platform package assembly
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-bin-${{ matrix.target }}
          path: raw-bin/${{ matrix.target }}/${{ matrix.bin_name }}
          if-no-files-found: error

  build-rust:
    name: Build & Package (Rust Crates)
    needs: [plan, gate]
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_name }}
      - name: Set up Pixi default environment
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: default
          locked: true
          cache: true
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Stamp unified release version across manifests
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
        run: python3 -m automation.stamp_version all "$RELEASE_TAG"
      - name: Build TypeScript dist output before embedding in playtest-assets
        run: pixi run --frozen build-ts-dist
      - name: Package all 5 Rust crates
        run: pixi run --frozen package-rs
      - name: Upload Rust crate artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-rust
          path: target/package/*.crate
          if-no-files-found: error

  build-python:
    name: Build Maturin Wheel (${{ matrix.target }})
    needs: [plan, gate]
    if: needs.plan.outputs.python == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            sdist: "true"
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            sdist: "false"
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            sdist: "false"
          - target: aarch64-apple-darwin
            runner: macos-15
            sdist: "false"
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            sdist: "false"
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_name }}
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Stamp unified release version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
        run: python -m automation.stamp_version all "$RELEASE_TAG"
      - name: Stage embedded SDK assets for maturin build
        shell: bash
        run: python -m automation.stage_assets --build-generated
      - name: Build platform wheel via maturin-action
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          sccache: "true"
      - name: Build Python sdist on primary Linux runner
        if: matrix.sdist == 'true'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          working-directory: python
          args: --out dist
      - name: Upload Python wheel and sdist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-python-${{ matrix.target }}
          path: python/dist/*
          if-no-files-found: error

  build-typescript:
    name: Assemble npm Platform & Wrapper Packages
    needs: [plan, gate, build-cli]
    if: needs.plan.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_name }}
      - name: Set up Pixi default and ts environments
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: default ts
          locked: true
          cache: true
      - name: Stamp unified release version
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
        run: python3 -m automation.stamp_version all "$RELEASE_TAG"
      - name: Build and test TypeScript SDK
        run: pixi run --frozen -e ts sdk-release
      - name: Download Phase 1 CLI binaries across all 5 platforms
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-bin-*
          path: raw-bin/
          merge-multiple: true
      - name: Install pinned cargo-npm 0.1.5
        run: pixi run --frozen cargo install cargo-npm --version 0.1.5 --locked
      - name: Generate and pack npm platform and wrapper tarballs
        run: pixi run --frozen python -m automation.npm_packages pack-release --binaries-dir raw-bin --out-dir npm-dist --use-cargo-npm
      - name: Upload npm platform and wrapper tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-typescript
          path: npm-dist/*.tgz
          if-no-files-found: error

  build-conda:
    name: Build Conda Package (${{ matrix.conda_platform }})
    needs: [plan, gate]
    if: needs.plan.outputs.rust == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - conda_platform: linux-64
            runner: ubuntu-24.04
          - conda_platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - conda_platform: osx-64
            runner: macos-15-intel
          - conda_platform: osx-arm64
            runner: macos-15
          - conda_platform: win-64
            runner: windows-2025
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_name }}
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Set up Pixi CLI
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          run-install: false
      - name: Stamp unified release version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
        run: python -m automation.stamp_version all "$RELEASE_TAG"
      - name: Stage embedded SDK assets for conda build
        shell: bash
        run: python -m automation.stage_assets --build-generated
      - name: Build .conda package for ${{ matrix.conda_platform }}
        shell: bash
        run: pixi build --path conda --target-platform "${{ matrix.conda_platform }}" --output-dir conda-dist
      - name: Clean staged SDK assets
        shell: bash
        run: python -m automation.stage_assets --clean
      - name: Upload built .conda package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-conda-${{ matrix.conda_platform }}
          path: conda-dist/*.conda
          if-no-files-found: error

  build-cpp:
    name: Build & Package (C++)
    needs: [plan, gate]
    if: needs.plan.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_name }}
      - name: Set up Pixi cpp environment
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: cpp
          locked: true
          cache: true
      - name: Stamp C++ SDK version
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
        run: python3 -m automation.stamp_version cpp "$RELEASE_TAG"
      - name: Package C++ header archive
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
        run: pixi run --frozen -e cpp sdk-release
      - name: Upload C++ artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-cpp
          path: cpp/dist/*
          if-no-files-found: error

  build-c:
    name: Build & Package (C)
    needs: [plan, gate]
    if: needs.plan.outputs.c == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_name }}
      - name: Set up Pixi c environment
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: c
          locked: true
          cache: true
      - name: Stamp C SDK version
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
        run: python3 -m automation.stamp_version c "$RELEASE_TAG"
      - name: Package C source archive
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
        run: pixi run --frozen -e c sdk-release
      - name: Upload C artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-c
          path: c/dist/*
          if-no-files-found: error

  build-csharp:
    name: Build & Package (C#)
    needs: [plan, gate]
    if: needs.plan.outputs.csharp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_name }}
      - name: Set up Pixi csharp environment
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: csharp
          locked: true
          cache: true
      - name: Stamp C# SDK version
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
        run: python3 -m automation.stamp_version csharp "$RELEASE_TAG"
      - name: Build C# NuGet package
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
        run: pixi run --frozen -e csharp sdk-release
      - name: Upload C# artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-csharp
          path: csharp/dist/*
          if-no-files-found: error

  build-go:
    name: Build & Package (Go)
    needs: [plan, gate]
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_name }}
      - name: Set up Pixi go environment
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: go
          locked: true
          cache: true
      - name: Stamp Go SDK version
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
        run: python3 -m automation.stamp_version go "$RELEASE_TAG"
      - name: Package Go module archive
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
        run: pixi run --frozen -e go sdk-release
      - name: Upload Go artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-go
          path: go/dist/*
          if-no-files-found: error

  build-java:
    name: Build & Package (Java)
    needs: [plan, gate]
    if: needs.plan.outputs.java == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_name }}
      - name: Set up Pixi java environment
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: java
          locked: true
          cache: true
      - name: Stamp Java SDK version
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
        run: python3 -m automation.stamp_version java "$RELEASE_TAG"
      - name: Build Java JAR distribution
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
        run: pixi run --frozen -e java sdk-release
      - name: Upload Java artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-java
          path: java/dist/*
          if-no-files-found: error

  build-r:
    name: Build & Package (R)
    needs: [plan, gate]
    if: needs.plan.outputs.r == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cran
    env:
      AUTHOR_EMAIL: ${{ vars.AUTHOR_EMAIL || secrets.AUTHOR_EMAIL }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_name }}
      - name: Set up Pixi r environment
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: r
          locked: true
          cache: true
      - name: Stamp R package version and maintainer email
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
        run: python3 -m automation.stamp_version r "$RELEASE_TAG" --author-email "$AUTHOR_EMAIL"
      - name: Build R source package
        run: pixi run --frozen -e r sdk-release
      - name: Upload R artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-r
          path: r/dist/*
          if-no-files-found: error

  publish-crates:
    name: Publish to crates.io (Rust)
    needs: [plan, build-rust]
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: crates
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_name }}
      - name: Set up Pixi default environment
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: default
          locked: true
          cache: true
      - name: Stamp Rust workspace version
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
        run: python3 -m automation.stamp_version rust "$RELEASE_TAG"
      - name: Authenticate with crates.io via OIDC
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish 5 workspace crates in topological order
        run: pixi run --frozen publish-rs

  publish-pypi:
    name: Publish to PyPI (Python)
    needs: [plan, build-python]
    if: needs.plan.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download Phase 1 Python wheels and sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-python-*
          path: python/dist/
          merge-multiple: true
      - name: Publish to PyPI via Trusted Publishing OIDC
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: python/dist/

  publish-npm:
    name: Publish Platform & Wrapper Packages to npm
    needs: [plan, build-typescript]
    if: needs.plan.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_name }}
      - name: Set up Node.js for npm OIDC provenance
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Download Phase 1 npm platform and wrapper tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-typescript
          path: npm-dist/
      - name: Publish platform packages first, then @archont561/playtest wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: python3 -m automation.publish_registries npm

  publish-conda:
    name: Upload Conda Packages (prefix.dev)
    needs: [plan, build-conda]
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: conda
    env:
      PREFIX_DEV_TOKEN: ${{ secrets.PREFIX_DEV_TOKEN }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_name }}
      - name: Download Phase 1 .conda packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-conda-*
          path: conda-dist/
          merge-multiple: true
      - name: Upload .conda packages to prefix.dev/archont561/archont561
        run: python3 -m automation.publish_registries conda

  publish-conan:
    name: Publish C and C++ to Conan
    needs: [plan, build-cpp, build-c]
    if: >-
      always() && needs.plan.outputs.valid == 'true' &&
      (needs.plan.outputs.cpp == 'true' || needs.plan.outputs.c == 'true') &&
      (needs.plan.outputs.cpp != 'true' || needs.build-cpp.result == 'success') &&
      (needs.plan.outputs.c != 'true' || needs.build-c.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: conan
    env:
      CONAN_REMOTE_URL: ${{ secrets.CONAN_REMOTE_URL }}
      CONAN_USERNAME: ${{ secrets.CONAN_USERNAME }}
      CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
      ENABLE_CPP: ${{ needs.plan.outputs.cpp }}
      ENABLE_C: ${{ needs.plan.outputs.c }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_name }}
      - name: Install Conan 2 when remote credentials are configured
        if: env.CONAN_REMOTE_URL != '' && env.CONAN_USERNAME != '' && env.CONAN_PASSWORD != ''
        run: python3 -m pip install --disable-pip-version-check "conan>=2,<3"
      - name: Publish selected Conan recipes or emit skip warning
        run: python3 -m automation.publish_registries conan

  publish-nuget:
    name: Publish to NuGet (C#)
    needs: [plan, build-csharp]
    if: needs.plan.outputs.csharp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: nuget
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_name }}
      - name: Download NuGet package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-csharp
          path: csharp/dist/
      - name: Set up .NET SDK when API key is configured
        if: env.NUGET_API_KEY != ''
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Publish NuGet package or emit skip warning
        run: python3 -m automation.publish_registries nuget

  publish-maven-central:
    name: Publish to Maven Central (Java)
    needs: [plan, build-java]
    if: needs.plan.outputs.java == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: maven
    env:
      CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_name }}
      - name: Set up Java, Maven credentials, and GPG signing
        if: env.CENTRAL_USERNAME != '' && env.CENTRAL_PASSWORD != '' && env.MAVEN_GPG_PRIVATE_KEY != '' && env.MAVEN_GPG_PASSPHRASE != ''
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          cache: maven
          cache-dependency-path: java/pom.xml
      - name: Publish signed Java artifacts or emit skip warning
        run: python3 -m automation.publish_registries maven

  prepare-cran:
    name: Validate CRAN Source Package
    needs: [plan, build-r]
    if: needs.plan.outputs.r == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_name }}
      - name: Download R source package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-r
          path: r/dist/
      - name: Set up R
        uses: r-lib/actions/setup-r@73ce8628fe8c47fb7ee9598fd6fcbcd40511dd7b # v2-branch
        with:
          r-version: release
      - name: Install R check dependencies
        uses: r-lib/actions/setup-r-dependencies@73ce8628fe8c47fb7ee9598fd6fcbcd40511dd7b # v2-branch
        with:
          working-directory: r
          extra-packages: any::testthat
      - name: Run CRAN-style R package check
        run: python3 -m automation.publish_registries check-cran

  github-release:
    name: Publish GitHub Release & Binary Checksums
    needs:
      - plan
      - build-cli
      - build-rust
      - build-python
      - build-typescript
      - build-conda
      - build-cpp
      - build-c
      - build-csharp
      - build-go
      - build-java
      - build-r
      - publish-crates
      - publish-pypi
      - publish-npm
      - publish-conda
      - publish-maven-central
      - publish-conan
      - publish-nuget
      - prepare-cran
    if: >-
      always() &&
      needs.plan.outputs.valid == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.tag_name }}
      - name: Set up Pixi default environment
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: default
          locked: true
          cache: true
      - name: Download Phase 1 CLI binary archives and per-archive .sha256 sidecars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-archive-*
          path: dist/
          merge-multiple: true
      - name: Assemble combined sha256.sum across all 5 supported platforms
        run: python3 -m automation.release_binaries combine-checksums --dist-dir dist --output dist/sha256.sum
      - name: Generate release notes via convco
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
        run: pixi run --frozen python -m automation.release changelog --tag "$RELEASE_TAG" --output RELEASE_NOTES.md
      - name: Publish GitHub Release with all binary archives and checksums attached
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.plan.outputs.tag_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: dist/*

  publish-go:
    name: Tag & Register Go Module (After Binary Release)
    needs: [plan, build-go, github-release]
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_name }}
      - name: Verify GitHub Release binaries and push Go subdirectory tag go/vX.Y.Z
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
        run: python3 -m automation.publish_go "$RELEASE_TAG"

  publish-runiverse:
    name: Verify R-universe Auto-Publication
    needs: [plan, github-release]
    if: needs.plan.outputs.r == 'true' && vars.RUNIVERSE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      RUNIVERSE_OWNER: ${{ vars.RUNIVERSE_OWNER || github.repository_owner }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag_name }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_name }}
      - name: Poll R-universe API until published version succeeds
        run: python3 -m automation.publish_registries wait-runiverse
