  # ============================================================================
  # Milestone M5 Addendum: CLI Machine Contract & Consumer Integration (v0.5.0)
  # ============================================================================
  - id: task_035
    title: Machine-consumable CLI output and exit-status contract
    description: "Stabilize the CLI as a programmable interface per Spec 0008 §7: semantic exit statuses, versioned JSON documents, and non-interactive stream discipline."
    status: backlog
    priority: P0
    milestone: M5-v0.5.0
    semver: "0.5.0"
    labels: [M5, cli, contract]
    repo_targets: [playtest]
    acceptance_criteria:
      - "Exit statuses are implemented and documented as Spec 0008 §7: 0 pass, 1 test failure, 2 usage/selection error, 3 environment failure"
      - "Every --format json document carries schema_version, and the schema is documented in Spec 0008"
      - "Machine modes write report data to stdout only, diagnostics to stderr, never prompt, and emit no ANSI color; pretty mode honors NO_COLOR"
      - "Failing property-test entries include the seed or replay command needed to reproduce the case"
      - "CLI tests assert exit statuses and schema_version for pass, test-failure, usage-error, and missing-toolchain scenarios"
    dependencies: [task_026]

