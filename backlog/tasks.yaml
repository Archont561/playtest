  # ============================================================================
  # Milestone M5 Addendum: CLI Machine Contract & Consumer Integration (v0.5.0)
  # ============================================================================
  - id: task_035
    title: Machine-consumable CLI output and exit-status contract
    description: "Stabilize the CLI as a programmable interface per Spec 0008 §7: semantic exit statuses, versioned JSON documents, and non-interactive stream discipline."
    status: backlog
    priority: P0
    milestone: M5-v0.5.0
    semver: "0.5.0"
    labels: [M5, cli, contract]
    repo_targets: [playtest]
    acceptance_criteria:
      - "Exit statuses are implemented and documented as Spec 0008 §7: 0 pass, 1 test failure, 2 usage/selection error, 3 environment failure"
      - "Every --format json document carries schema_version, and the schema is documented in Spec 0008"
      - "Machine modes write report data to stdout only, diagnostics to stderr, never prompt, and emit no ANSI color; pretty mode honors NO_COLOR"
      - "Failing property-test entries include the seed or replay command needed to reproduce the case"
      - "CLI tests assert exit statuses and schema_version for pass, test-failure, usage-error, and missing-toolchain scenarios"
    dependencies: [task_026]

  - id: task_036
    title: Explicit tier selection and fail-instead-of-skip semantics
    description: "Implement Spec 0008 §6: --tier selection mapped to native marker/filter mechanisms, and hard failure with remediation when an explicitly selected target cannot run."
    status: backlog
    priority: P0
    milestone: M5-v0.5.0
    semver: "0.5.0"
    labels: [M5, cli, selection]
    repo_targets: [playtest]
    acceptance_criteria:
      - "--tier supports at least unit and smoke, each mapped to the target's native mechanism, with mappings visible in playtest list"
      - "An unknown tier or a selection matching no target exits 2 instead of running green and empty"
      - "An explicitly selected target with a missing or unqualified toolchain exits 3 with doctor-style remediation; --skip-unavailable restores visible skip reporting"
      - "Excluded targets are reported as excluded and never affect the exit status"
      - "Playtest-provided native runner integrations fail an explicitly requested tier whose host prerequisites are missing instead of skipping green (Spec 0005 §4 cross-reference), covered by conformance cases"
    dependencies: [task_026]

