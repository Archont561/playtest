      - "An unknown tier or a selection matching no target exits 2 instead of running green and empty"
      - "An explicitly selected target with a missing or unqualified toolchain exits 3 with doctor-style remediation; --skip-unavailable restores visible skip reporting"
      - "Excluded targets are reported as excluded and never affect the exit status"
      - "Playtest-provided native runner integrations fail an explicitly requested tier whose host prerequisites are missing instead of skipping green (Spec 0005 §4 cross-reference), covered by conformance cases"
    dependencies: [task_026]

