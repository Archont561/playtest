[workspace]
name = "playtest-c"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
clang-format = ">=23.0"
lcov = ">=2.5"

[tasks]
build = "mkdir -p target && gcc -std=c11 src/playtest.c tests/test_version.c -I include -o target/test_c"
test = { cmd = "./target/test_c", depends-on = ["build"] }
coverage = "mkdir -p target coverage && gcc -std=c11 --coverage src/playtest.c tests/test_version.c -I include -o target/test_c_cov && ./target/test_c_cov && lcov --capture --directory target/ -o coverage/lcov.info --ignore-errors mismatch,gcov,negative && lcov --remove coverage/lcov.info '/usr/include/*' -o coverage/lcov.info --ignore-errors unused"
lint = "clang-format --dry-run --Werror include/playtest/playtest.h src/playtest.c tests/test_version.c && gcc -std=c11 -Wall -Wextra -Wpedantic -fsyntax-only -I include src/playtest.c tests/test_version.c"
fmt = "clang-format -i include/playtest/playtest.h src/playtest.c tests/test_version.c"
fmt-check = "clang-format --dry-run --Werror include/playtest/playtest.h src/playtest.c tests/test_version.c"
release = { cmd = "mkdir -p dist && tar -czf dist/playtest-c-0.1.0.tar.gz include/ src/ CMakeLists.txt && ls -lh dist/", depends-on = [
  "build",
  "lint",
  "test",
] }
