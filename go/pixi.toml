[workspace]
name = "playtest-go"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
go = ">=1.21"
golangci-lint = ">=2.15.0,<3"

[tasks]
build = "go build ./..."
test = "go test -v ./..."
coverage = "mkdir -p coverage && go test -coverprofile=coverage/cover.out ./... && go run ./cmd/cover2lcov coverage/cover.out coverage/lcov.info"
lint = "go vet ./... && golangci-lint run ./..."
fmt = "go fmt ./..."
fmt-check = "test -z \"$(go fmt .)\""
release = { cmd = "mkdir -p dist && tar -czf dist/playtest-go-0.1.0.tar.gz go.mod *.go && ls -lh dist/", depends-on = [
  "build",
  "lint",
  "test",
] }
