schema = 1
branch_prefix = "sandbox"
cargo_vendor = true

[workflow]
permissions = true
pixi_version = "v0.84.1"
setup_pixi_cache = false

# `default` only, and that is a hard constraint rather than a preference.
#
# `pixi-sandbox doctor` enforces `budgets.max_transport_mib`, which defaults to 2048 MiB.
# The `default` environment alone is already about 2.6 GiB, so it sits at the limit; adding
# the eight SDK lanes took the transport to roughly 22 GiB and the publish failed during
# doctor. An SDK lane therefore cannot be packed alongside `default`, and a lane on its own
# would still need `default`'s toolchain to be useful.
#
# The consequence is deliberate: `pixi run -e <lane>` needs the network here, so SDK lanes
# are proved by CI (`sdk-<lane>`) rather than offline. Do not re-add environments to this
# bundle without first checking the measured transport size against the budget.
[[bundle]]
name = "developer"
environments = ["default"]
platforms = ["linux-64"]
