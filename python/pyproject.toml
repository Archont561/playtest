[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "playtest-py"
version = "0.1.0"
description = "Polyglot test framework with the batteries included: dependency-injected fixtures, strict LIFO teardown, property-based testing, and code-first BDD for Python"
readme = "README.md"
authors = [{ name = "Archont561" }]
license = "MIT"
requires-python = ">=3.10"
keywords = ["testing", "bdd", "fixtures", "playwright", "test-framework"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Topic :: Software Development :: Testing",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
]
dependencies = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://github.com/Archont561/playtest"
Repository = "https://github.com/Archont561/playtest"

[tool.maturin]
manifest-path = "../crates/playtest-cli/Cargo.toml"
module-name = "playtest"
bindings = "bin"
python-source = "src"
python-packages = ["playtest"]
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
