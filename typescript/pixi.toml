[workspace]
name = "playtest-ts"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
bun = ">=1.3.0"

[tasks]
build = "bun build src/index.ts --outdir dist --target node"
test = "bun test tests"
coverage = "bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage tests"
lint = "bunx biome lint src/ tests/ && bun test tests"
fmt = "bunx biome format --write src/ tests/"
fmt-check = "bunx biome format src/ tests/"
release = { cmd = "bun pm pack --dry-run", depends-on = [
  "build",
  "test",
  "lint",
] }
publish = { cmd = "npm publish --provenance --access public", depends-on = [
  "build",
  "test",
] }
