# yaml-language-server: $schema=https://alint.org/_alint/configuration/schema.json
version: 1
rules:
- id: pcc-r01-pixi-manifest
  kind: file_exists
  paths: pixi.toml
  level: error
  message: '[PCC-R01] Keep pixi.toml and pixi.lock together; the lockfile is the environment of record.'
- id: pcc-r01-pixi-lock
  kind: file_exists
  paths: pixi.lock
  level: error
  message: '[PCC-R01] Keep pixi.toml and pixi.lock together; the lockfile is the environment of record.'
- id: pcc-r02-dodo-file
  kind: file_exists
  paths: automation/dodo.py
  level: error
  message: '[PCC-R02] Keep automation in automation/dodo.py through doit.cfg and single-line workflow
    run steps.'
- id: pcc-r02-doit-config
  kind: file_exists
  paths: doit.cfg
  level: error
  message: '[PCC-R02] Keep automation in automation/dodo.py through doit.cfg and single-line workflow
    run steps.'
# The two excluded files are generated by `pixi-sandbox init` and keep its checksum-verified
# bootstrap step; hand-maintained workflows stay in scope for the single-line rule.
- id: pcc-r02-workflow-run-single-line
  kind: yaml_path_matches
  paths:
  - .github/workflows/*.yml
  - '!.github/workflows/publish-sandbox.yml'
  - '!.github/workflows/relock.yml'
  path: $.jobs.*.steps[*].run
  matches: ^[^\n]+$
  if_present: true
  level: error
  message: '[PCC-R02] Keep automation in automation/dodo.py through doit.cfg and single-line workflow
    run steps.'
- id: pcc-r03-package-manifest
  kind: file_exists
  paths: package.json
  level: error
  message: '[PCC-R03] Pin Bun developer CLIs, hooks and Conventional Commit configuration.'
- id: pcc-r03-bun-lock
  kind: file_exists
  paths: bun.lock
  level: error
  message: '[PCC-R03] Pin Bun developer CLIs, hooks and Conventional Commit configuration.'
- id: pcc-r03-hooks
  kind: file_exists
  paths: lefthook.yml
  level: error
  message: '[PCC-R03] Pin Bun developer CLIs, hooks and Conventional Commit configuration.'
- id: pcc-r03-convco
  kind: file_exists
  paths: .versionrc
  level: error
  message: '[PCC-R03] Pin Bun developer CLIs, hooks and Conventional Commit configuration.'
- id: pcc-r03-bun-package-manager
  kind: json_path_matches
  paths: package.json
  path: $.packageManager
  matches: ^bun@1\.4\.\d+$
  level: error
  message: '[PCC-R03] Pin Bun developer CLIs, hooks and Conventional Commit configuration.'
- id: pcc-r04-readme
  kind: file_exists
  paths: README.md
  level: error
  message: '[PCC-R04] Maintain README, AGENTS, contributing guidance, a documentation index, and a rule register.'
- id: pcc-r04-agents
  kind: file_exists
  paths: AGENTS.md
  level: error
  message: '[PCC-R04] Maintain README, AGENTS, contributing guidance, a documentation index, and a rule register.'
- id: pcc-r04-contributing
  kind: file_exists
  paths: CONTRIBUTING.md
  level: error
  message: '[PCC-R04] Maintain README, AGENTS, contributing guidance, a documentation index, and a rule register.'
- id: pcc-r04-docs-index
  kind: file_exists
  paths: docs/README.md
  level: error
  message: '[PCC-R04] Maintain README, AGENTS, contributing guidance, a documentation index, and a rule register.'
- id: pcc-r04-development-guide
  kind: file_exists
  paths: docs/guides/development-setup.md
  level: error
  message: '[PCC-R04] Maintain README, AGENTS, contributing guidance, a documentation index, and a rule register.'
- id: pcc-r04-rule-register
  kind: file_exists
  paths: docs/concepts/rule-register.md
  level: error
  message: '[PCC-R04] Maintain README, AGENTS, contributing guidance, a documentation index, and a rule register.'
- id: pcc-r05-workflow-contents-read
  kind: yaml_path_equals
  paths:
  - .github/workflows/*.yml
  path: $.permissions.contents
  equals: read
  level: error
  message: '[PCC-R05] Declare read-only workflow permissions and pin third-party actions to full commit
    SHAs.'
- id: pcc-r05-pin-actions-to-sha
  kind: yaml_path_matches
  paths:
  - .github/workflows/*.yml
  path: $.jobs.*.steps[*].uses
  matches: ^[a-zA-Z0-9._/-]+@[a-f0-9]{40}$
  if_present: true
  level: error
  message: '[PCC-R05] Declare read-only workflow permissions and pin third-party actions to full commit
    SHAs.'
- id: pcc-r05-issue-forms
  kind: file_exists
  paths:
  - .github/ISSUE_TEMPLATE/bug_report.yml
  - .github/ISSUE_TEMPLATE/feature_request.yml
  - .github/ISSUE_TEMPLATE/config.yml
  - .github/PULL_REQUEST_TEMPLATE.md
  level: error
  message: '[PCC-R05] Declare read-only workflow permissions and pin third-party actions to full commit
    SHAs.'
- id: pcc-r05-blank-issues-disabled
  kind: yaml_path_equals
  paths: .github/ISSUE_TEMPLATE/config.yml
  path: $.blank_issues_enabled
  equals: false
  level: error
  message: '[PCC-R05] Declare read-only workflow permissions and pin third-party actions to full commit
    SHAs.'
- id: pcc-r06-no-tracked-artifacts
  kind: file_absent
  paths:
  - .env
  - .DS_Store
  - dist/**
  - build/**
  - .venv/**
  level: error
  message: '[PCC-R06] Keep environment files, dependency caches and build outputs out of the repository.'
# `file_exists` with several paths passes when any one of them exists, so each test family
# gets its own rule; a shared list would let one existing directory mask a missing family.
- id: pcc-r07-ast-grep-rule-tests
  kind: file_exists
  paths: presets/ast-grep/*/rule-tests/*.yml
  level: warning
  message: '[PCC-R07] Every distributed rule needs a positive test target and a negative test target beside
    its config.'
- id: pcc-r07-semgrep-fixtures
  kind: file_exists
  paths: presets/semgrep/fixtures/*/*
  level: warning
  message: '[PCC-R07] Every distributed rule needs a positive test target and a negative test target beside
    its config.'
- id: pcc-r08-convco-types
  kind: yaml_path_matches
  paths: .versionrc
  path: $.types[*].type
  matches: ^(feat|fix|perf|docs|revert|refactor|test|build|ci|chore|style)$
  level: error
  message: '[PCC-R08] Keep Conventional Commit types and Backlog statuses inside their approved vocabularies.'
- id: pcc-r08-backlog-statuses
  kind: yaml_path_matches
  paths: backlog/config.yml
  path: $.statuses[*]
  matches: ^(To Do|In Progress|Done)$
  level: error
  message: '[PCC-R08] Keep Conventional Commit types and Backlog statuses inside their approved vocabularies.'
