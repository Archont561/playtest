rules:
- id: pcc-p01-swallowed-exception-python
  languages:
  - python
  severity: ERROR
  message: '[PCC-P01] Handle, translate or rethrow the exception; pass in an except block hides the failure.'
  metadata:
    pcc_id: PCC-P01
    pcc_title: Swallowed exceptions
    pcc_preset: recommended
    pcc_confidence: critical
    pcc_canonical_severity: error
    pcc_source: doc-2 CC309 broad exception swallowed; Archont561 fail-fast automation
    category: maintainability
  pattern-either:
  - pattern: |-
      try:
          ...
      except $EXC:
          pass
  - pattern: |-
      try:
          ...
      except:
          pass
- id: pcc-p02-unsafe-dynamic-python
  languages:
  - python
  severity: ERROR
  message: '[PCC-P02] Avoid eval, exec, pickle and unsafe YAML loading; use a typed parser such as ast.literal_eval
    or yaml.safe_load.'
  metadata:
    pcc_id: PCC-P02
    pcc_title: No dynamic execution or unsafe deserialization
    pcc_preset: recommended
    pcc_confidence: critical
    pcc_canonical_severity: error
    pcc_source: Semgrep security baseline and Archont561 explicitness/locked-dependency principle
    category: maintainability
  pattern-either:
  - pattern: eval(...)
  - pattern: exec(...)
  - pattern: pickle.loads(...)
  - pattern: pickle.load(...)
  - pattern: yaml.load(...)
- id: pcc-p03-shell-true-python
  languages:
  - python
  severity: ERROR
  message: '[PCC-P03] Pass an argument list without shell=True so command arguments cannot be reinterpreted
    by a shell.'
  metadata:
    pcc_id: PCC-P03
    pcc_title: No shell=True subprocess calls
    pcc_preset: recommended
    pcc_confidence: critical
    pcc_canonical_severity: error
    pcc_source: Semgrep security baseline and Archont561 fail-fast command automation
    category: maintainability
  pattern: subprocess.$CALL(..., shell=True, ...)
